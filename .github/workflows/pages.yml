name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_site.py
      - run: python3 -m unittest discover -s tests -v
      # configure-pages enablement needs permission to create the Pages site.
      # This app token gets 403 on that call. deploy-pages uses the workflow's
      # pages:write permission, which is enough once Pages exists and is also
      # the call that publishes the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The state file is how the next deploy tells a first submission from
      # URLs whose sitemap lastmod changed. It is not committed.
      - uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - run: python3 scripts/build_site.py
      - run: python3 scripts/indexnow.py --after-deploy --state .indexnow/state.json
